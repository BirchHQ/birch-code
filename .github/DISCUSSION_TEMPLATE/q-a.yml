body:
  - type: markdown
    attributes:
      value: |
        **This form is public.** For a suspected vulnerability, use [private vulnerability reporting](https://github.com/BirchHQ/birch-code/security/advisories/new) instead. Do not post secrets, private source code, or unredacted logs here.
  - type: textarea
    id: question
    attributes:
      label: Your question
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Birch version and OS
      placeholder: "e.g. 0.22.8 on macOS 14.5"
    validations:
      required: false
  - type: textarea
    id: tried
    attributes:
      label: What have you already tried?
    validations:
      required: false
